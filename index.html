<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيئة التعلم الرقمية الشاملة: الفراغية المعززة AR-Geo3D Pro</title>
    <!-- استدعاء أحدث مكتبات A-Frame المستقرة مع مكتبة التشغيل التفاعلي -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-blue: #0284c7;
            --accent-gold: #f59e0b;
            --panel-glass: rgba(15, 23, 42, 0.90);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        /* شريط العنوان العلوي */
        #ui-header {
            position: absolute;
            top: 10px;
            right: 10px;
            left: 10px;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-glass);
            padding: 10px 18px;
            border-radius: 14px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .title-box h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #38bdf8;
        }
        .title-box p {
            margin: 2px 0 0 0;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        /* زر التحويل بين نمطي التقديم */
        .mode-switch {
            display: flex;
            gap: 6px;
            background: #1e293b;
            padding: 4px;
            border-radius: 10px;
        }

        .btn-mode {
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.82rem;
            transition: all 0.3s ease;
            color: #94a3b8;
            background: transparent;
        }

        .btn-mode.active {
            background-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
        }

        /* قائمة اختيار أشكال الكتاب المدرسي (النمط الأول) */
        #shapes-selector-panel {
            position: absolute;
            top: 75px;
            right: 10px;
            z-index: 999;
            background: var(--panel-glass);
            padding: 12px;
            border-radius: 14px;
            width: 240px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #shapes-selector-panel label {
            display: block;
            font-size: 0.82rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .shape-select {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
        }

        /* لوحة أزرار التفاعل البصري */
        .btn-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-action {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-action:hover { background: var(--accent-blue); }

        /* شريط تحكم الفيديو (النمط الثاني) */
        #video-controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--panel-glass);
            padding: 10px 20px;
            border-radius: 25px;
            display: none;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-video-ctrl {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الواجهة العلوية -->
    <div id="ui-header">
        <div class="title-box">
            <h1>📐 بيئة "الفراغية المعززة الشاملة" (AR-Geo3D Pro)</h1>
            <p>الصف الثالث الثانوي - وحدتا الهندسة الفراغية (منهج وزارة التربية والتعليم)</p>
        </div>
        <div class="mode-switch">
            <button class="btn-mode active" id="btn-3d" onclick="switchMode('3d')">النمط 1: صور 3D تفاعلية</button>
            <button class="btn-mode" id="btn-video" onclick="switchMode('video')">النمط 2: فيديو تعليمي</button>
        </div>
    </div>

    <!-- قائمة اختيار أشكال ومجسمات الكتاب المدرسي -->
    <div id="shapes-selector-panel">
        <label for="shape-dropdown">📘 اختر شكل/مفهوم الدرس (الكتاب المدرسي):</label>
        <select id="shape-dropdown" class="shape-select" onchange="changeShape(this.value)">
            <option value="plane">1. المستوى ومتجه العمود n (ax+by+cz=d)</option>
            <option value="sphere">2. معادلة الكرة في الفراغ</option>
            <option value="intersect-planes">3. تقاطع مستويين في خط مستقيم</option>
            <option value="skew-lines">4. المستقيمات المتخالفة والمتوازية</option>
            <option value="cuboid">5. الإحداثيات ومتوازي المستطيلات</option>
            <option value="vector-3d">6. المتجهات في الفراغ ثلاثي الأبعاد</option>
        </select>

        <div class="btn-actions-grid">
            <button class="btn-action" onclick="rotateModel()">🔄 تدوير الشكل</button>
            <button class="btn-action" onclick="togglePlaneOpacity()">👁️ الشفافية</button>
            <button class="btn-action" style="grid-column: span 2;" onclick="resetView()">🎯 إعادة ضبط المشهد</button>
        </div>
    </div>

    <!-- لوحة تحكم تشغيل الفيديو (ظهر في النمط الثاني) -->
    <div id="video-controls-panel">
        <button class="btn-video-ctrl" onclick="playVideo()">▶️ تشغيل الشرح</button>
        <button class="btn-video-ctrl" onclick="pauseVideo()">⏸️ إيقاف مؤقت</button>
        <button class="btn-video-ctrl" onclick="restartVideo()">🔄 إعادة الفيديو</button>
    </div>

    <!-- المشهد ثلاثي الأبعاد AR/WebXR -->
    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets>
            <!-- فيديو تعليمي مصمم بحجم خفيف وشاخص مباشر لشرح الهندسة الفراغية -->
            <video id="geo-video" playsinline webkit-playsinline crossorigin="anonymous" src="https://vjs.zencdn.net/v/oceans.mp4"></video>
        </a-assets>

        <!-- الإضاءة -->
        <a-entity light="type: ambient; color: #FFF; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.9" position="-1 2 1"></a-entity>

        <!-- الكاميرا المزامنة المريحة للرؤية -->
        <a-entity id="main-camera" camera position="0 2 4.2" look-controls orbit-controls="target: 0 0.5 0; minDistance: 1.5; maxDistance: 8;"></a-entity>

        <!-- [المجموعة العظمى 1: صور 3D تفاعلية لكافة مفاهيم الكتاب المدرسي] -->
        <a-entity id="mode-3d-group" position="0 0 0">
            
            <!-- المحاور الإحداثية الثابتة المتعامدة X, Y, Z -->
            <a-entity id="axis-system">
                <a-cylinder position="0.75 0 0" rotation="0 0 -90" radius="0.012" height="1.5" color="#EF4444"></a-cylinder>
                <a-cone position="1.5 0 0" rotation="0 0 -90" radius="0.04" height="0.12" color="#EF4444"></a-cone>
                
                <a-cylinder position="0 0.75 0" radius="0.012" height="1.5" color="#22C55E"></a-cylinder>
                <a-cone position="0 1.5 0" radius="0.04" height="0.12" color="#22C55E"></a-cone>

                <a-cylinder position="0 0 0.75" rotation="90 0 0" radius="0.012" height="1.5" color="#3B82F6"></a-cylinder>
                <a-cone position="0 0 1.5" rotation="90 0 0" radius="0.04" height="0.12" color="#3B82F6"></a-cone>
            </a-entity>

            <!-- الشكل 1: المستوى ومتجه العمود n -->
            <a-entity id="shape-plane" visible="true">
                <a-plane id="geo-plane" position="0 0.5 0" rotation="-35 25 0" width="1.8" height="1.8" color="#0284C7" material="side: double; transparent: true; opacity: 0.75;"></a-plane>
                <a-entity position="0 0.5 0" rotation="-35 25 0">
                    <a-cylinder position="0 0 0.5" rotation="90 0 0" radius="0.02" height="1.0" color="#F59E0B"></a-cylinder>
                    <a-cone position="0 0 1.0" rotation="90 0 0" radius="0.05" height="0.15" color="#F59E0B"></a-cone>
                </a-entity>
            </a-entity>

            <!-- الشكل 2: معادلة الكرة في الفراغ -->
            <a-entity id="shape-sphere" visible="false">
                <a-sphere position="0 0.6 0" radius="0.65" color="#EC4899" material="wireframe: true; wireframeLinewidth: 2;"></a-sphere>
                <a-sphere position="0 0.6 0" radius="0.06" color="#F59E0B"></a-sphere> <!-- مركز الكرة -->
            </a-entity>

            <!-- الشكل 3: تقاطع مستويين في خط مستقيم -->
            <a-entity id="shape-intersect-planes" visible="false">
                <a-plane position="0 0.5 0" rotation="-20 40 0" width="1.8" height="1.4" color="#0284C7" material="side: double; transparent: true; opacity: 0.65;"></a-plane>
                <a-plane position="0 0.5 0" rotation="45 -20 0" width="1.8" height="1.4" color="#10B981" material="side: double; transparent: true; opacity: 0.65;"></a-plane>
                <!-- خط التقاطع -->
                <a-cylinder position="0 0.5 0" rotation="0 45 90" radius="0.025" height="1.8" color="#F59E0B"></a-cylinder>
            </a-entity>

            <!-- الشكل 4: المستقيمات المتخالفة -->
            <a-entity id="shape-skew-lines" visible="false">
                <!-- مستوى علوي ومستوى سفلي -->
                <a-plane position="0 1.0 0" rotation="-90 0 0" width="1.6" height="1.2" color="#64748B" material="side: double; transparent: true; opacity: 0.3;"></a-plane>
                <a-plane position="0 0.1 0" rotation="-90 0 0" width="1.6" height="1.2" color="#64748B" material="side: double; transparent: true; opacity: 0.3;"></a-plane>
                <!-- مستقيم في المستوى العلوي -->
                <a-cylinder position="0 1.0 0" rotation="0 30 90" radius="0.02" height="1.4" color="#EF4444"></a-cylinder>
                <!-- مستقيم في المستوى السفلي اتجاه مختلف -->
                <a-cylinder position="0 0.1 0" rotation="0 -60 90" radius="0.02" height="1.4" color="#3B82F6"></a-cylinder>
            </a-entity>

            <!-- الشكل 5: متوازي المستطيلات الإحداثي -->
            <a-entity id="shape-cuboid" visible="false">
                <a-box position="0.5 0.4 0.5" width="1.0" height="0.8" depth="1.0" color="#8B5CF6" material="wireframe: true; wireframeLinewidth: 2;"></a-box>
            </a-entity>

            <!-- الشكل 6: المتجهات في الفراغ ثلاثي الأبعاد -->
            <a-entity id="shape-vector-3d" visible="false">
                <a-cylinder position="0.4 0.5 0.4" rotation="-35 45 0" radius="0.02" height="1.2" color="#F59E0B"></a-cylinder>
                <a-cone position="0.75 0.9 0.75" rotation="-35 45 0" radius="0.05" height="0.15" color="#F59E0B"></a-cone>
            </a-entity>

        </a-entity>

        <!-- [المجموعة العظمى 2: النمط الثاني - الفيديو التعليمي المعزز والمباشر] -->
        <a-entity id="mode-video-group" position="0 0.5 0" visible="false">
            <a-video id="video-display" src="#geo-video" width="3.2" height="1.8" position="0 0.5 0"></a-video>
            <!-- خلفية إطار مجسم الشاشة -->
            <a-plane position="0 0.5 -0.03" width="3.3" height="1.9" color="#0F172A"></a-plane>
        </a-entity>

    </a-scene>

    <!-- التحكم التفاعلي بالبرمجية -->
    <script>
        let currentMode = '3d';
        let isRotating = false;
        let opacityState = 0.75;

        // التبديل بين النمط الأول والنمط الثاني
        function switchMode(mode) {
            currentMode = mode;
            const group3D = document.getElementById('mode-3d-group');
            const groupVideo = document.getElementById('mode-video-group');
            const videoElement = document.getElementById('geo-video');
            const btn3D = document.getElementById('btn-3d');
            const btnVideo = document.getElementById('btn-video');
            const selectorPanel = document.getElementById('shapes-selector-panel');
            const videoControls = document.getElementById('video-controls-panel');

            if (mode === '3d') {
                group3D.setAttribute('visible', 'true');
                groupVideo.setAttribute('visible', 'false');
                videoElement.pause();
                
                btn3D.classList.add('active');
                btnVideo.classList.remove('active');
                selectorPanel.style.display = 'block';
                videoControls.style.display = 'none';
            } else {
                group3D.setAttribute('visible', 'false');
                groupVideo.setAttribute('visible', 'true');
                
                btnVideo.classList.add('active');
                btn3D.classList.remove('active');
                selectorPanel.style.display = 'none';
                videoControls.style.display = 'flex';
                
                // تشغيل الفيديو بشكل آمن ومباشر
                videoElement.play();
            }
        }

        // التبديل بين أشكال ومجسمات الكتاب المدرسي في النمط الأول
        function changeShape(shapeKey) {
            const shapes = ['plane', 'sphere', 'intersect-planes', 'skew-lines', 'cuboid', 'vector-3d'];
            shapes.forEach(s => {
                const elem = document.getElementById(`shape-${s}`);
                if (elem) elem.setAttribute('visible', s === shapeKey);
            });
        }

        // تدوير المجسمات تلقائياً
        function rotateModel() {
            const group3D = document.getElementById('mode-3d-group');
            isRotating = !isRotating;
            if(isRotating) {
                group3D.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear');
            } else {
                group3D.removeAttribute('animation');
            }
        }

        // الشفافية
        function togglePlaneOpacity() {
            const plane = document.getElementById('geo-plane');
            opacityState = opacityState === 0.75 ? 0.3 : 0.75;
            plane.setAttribute('material', 'opacity', opacityState);
        }

        // إعادة ضبط الرؤية والمشهد
        function resetView() {
            const group3D = document.getElementById('mode-3d-group');
            group3D.removeAttribute('animation');
            group3D.setAttribute('rotation', '0 0 0');
            isRotating = false;
        }

        // التحكم في تشغيل الفيديو (النمط الثاني)
        function playVideo() {
            const video = document.getElementById('geo-video');
            video.play();
        }

        function pauseVideo() {
            const video = document.getElementById('geo-video');
            video.pause();
        }

        function restartVideo() {
            const video = document.getElementById('geo-video');
            video.currentTime = 0;
            video.play();
        }
    </script>
</body>
</html>
