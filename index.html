<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيئة التعلم الرقمية المطورة: الفراغية المعززة AR-Geo3D Pro</title>
    <!-- استدعاء أحدث مكتبات A-Frame و Three.js المستقرة -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #0284c7;
            --success-color: #10b981;
            --bg-glass: rgba(15, 23, 42, 0.85);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        /* شريط العنوان العلوي */
        #ui-header {
            position: absolute;
            top: 12px;
            right: 12px;
            left: 12px;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title-box h1 {
            margin: 0;
            font-size: 1.15rem;
            color: #38bdf8;
        }
        .title-box p {
            margin: 2px 0 0 0;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* زر التحويل بين نمطي التقديم */
        .mode-switch {
            display: flex;
            gap: 6px;
            background: #1e293b;
            padding: 4px;
            border-radius: 12px;
        }

        .btn-mode {
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            color: #94a3b8;
            background: transparent;
        }

        .btn-mode.active {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.5);
        }

        /* لوحة التحكم والتحكيم المباشر ببارامترات المعادلة (3D Simulator Controls) */
        #sim-controls {
            position: absolute;
            bottom: 20px;
            right: 12px;
            z-index: 999;
            background: var(--bg-glass);
            padding: 14px;
            border-radius: 16px;
            width: 260px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .control-group label { font-weight: bold; color: #38bdf8; }
        .control-group input[type="range"] { width: 130px; cursor: pointer; }

        /* أزرار التفاعل السريع */
        .btn-action-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-action:hover { background: var(--accent-color); }

        /* نافذة الأسئلة التفاعلية للفيديو */
        #quiz-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: #0f172a;
            border: 2px solid #0284c7;
            padding: 20px;
            border-radius: 16px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .quiz-option {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .quiz-option:hover { background: #0284c7; }
    </style>
</head>
<body>

    <!-- الواجهة العلوية -->
    <div id="ui-header">
        <div class="title-box">
            <h1>📐 بيئة "الفراغية المعززة المطورة" (AR-Geo3D Pro)</h1>
            <p>الصف الثالث الثانوي - وحدة الهندسة الفراغية</p>
        </div>
        <div class="mode-switch">
            <button class="btn-mode active" id="btn-3d" onclick="switchMode('3d')">النمط 1: صور 3D تفاعلية</button>
            <button class="btn-mode" id="btn-video" onclick="switchMode('video')">النمط 2: فيديو تعليمي</button>
        </div>
    </div>

    <!-- لوحة المحاكاة والتحكم المعرفي (خاص بالنمط الأول 3D) -->
    <div id="sim-controls">
        <div style="font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #f1f5f9; text-align: center;">
            🕹️ محاكي معاملات المستوى $ax + by + cz = d$
        </div>
        <div class="control-group">
            <label>المعامل $a$:</label>
            <input type="range" id="slider-a" min="-2" max="2" step="0.5" value="1" oninput="updatePlaneEquation()">
            <span id="val-a">1</span>
        </div>
        <div class="control-group">
            <label>المعامل $b$:</label>
            <input type="range" id="slider-b" min="-2" max="2" step="0.5" value="1" oninput="updatePlaneEquation()">
            <span id="val-b">1</span>
        </div>
        <div class="control-group">
            <label>المعامل $c$:</label>
            <input type="range" id="slider-c" min="-2" max="2" step="0.5" value="1" oninput="updatePlaneEquation()">
            <span id="val-c">1</span>
        </div>
        
        <div class="btn-action-group">
            <button class="btn-action" onclick="rotateModel()">🔄 تدوير تلقائي</button>
            <button class="btn-action" onclick="togglePlaneOpacity()">👁️ الشفافية</button>
        </div>
    </div>

    <!-- نافذة الأسئلة التفاعلية المفاجئة المدمجة مع الفيديو -->
    <div id="quiz-overlay">
        <h3 style="margin-top:0; color: #38bdf8;">❓ سؤال تقييمي سريع</h3>
        <p id="quiz-question">ما هو المتجه العمودي على المستوى الذي معادلته $2x - 3y + z = 5$؟</p>
        <button class="quiz-option" onclick="answerQuiz(true)">$\vec{n} = (2, -3, 1)$</button>
        <button class="quiz-option" onclick="answerQuiz(false)">$\vec{n} = (2, 3, 5)$</button>
        <button class="quiz-option" onclick="answerQuiz(false)">$\vec{n} = (1, -3, 2)$</button>
    </div>

    <!-- المشهد ثلاثي الأبعاد AR/WebXR -->
    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets>
            <video id="geo-video" loop="false" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
        </a-assets>

        <!-- الإضاءة -->
        <a-entity light="type: ambient; color: #FFF; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 2 1"></a-entity>

        <!-- الكاميرا المزامنة -->
        <a-entity id="main-camera" camera position="0 1.8 3.5" look-controls orbit-controls="target: 0 0.5 0; minDistance: 1; maxDistance: 10;"></a-entity>

        <!-- [المجموعة 1: النمط الأول 3D التفاعلي] -->
        <a-entity id="mode-3d-group" position="0 0 0">
            <!-- المحاور الإحداثية الثلاثية -->
            <a-cylinder position="1 0 0" rotation="0 0 -90" radius="0.015" height="2" color="#ef4444"></a-cylinder>
            <a-cone position="2.05 0 0" rotation="0 0 -90" radius="0.05" height="0.15" color="#ef4444"></a-cone>
            
            <a-cylinder position="0 1 0" radius="0.015" height="2" color="#22c55e"></a-cylinder>
            <a-cone position="0 2.05 0" radius="0.05" height="0.15" color="#22c55e"></a-cone>

            <a-cylinder position="0 0 1" rotation="90 0 0" radius="0.015" height="2" color="#3b82f6"></a-cylinder>
            <a-cone position="0 0 2.05" rotation="90 0 0" radius="0.05" height="0.15" color="#3b82f6"></a-cone>

            <!-- المستوى المتفاعل برمجياً -->
            <a-plane id="geo-plane" position="0 0.5 0" rotation="-45 30 0" width="2.2" height="2.2" color="#0284c7" material="side: double; transparent: true; opacity: 0.75;"></a-plane>

            <!-- المتجه العمودي على المستوى n -->
            <a-entity id="normal-vector" position="0 0.5 0" rotation="-45 30 0">
                <a-cylinder position="0 0 0.6" rotation="90 0 0" radius="0.03" height="1.2" color="#f59e0b"></a-cylinder>
                <a-cone position="0 0 1.25" rotation="90 0 0" radius="0.08" height="0.2" color="#f59e0b"></a-cone>
            </a-entity>
        </a-entity>

        <!-- [المجموعة 2: النمط الثاني - الفيديو التعليمي التفاعلي] -->
        <a-entity id="mode-video-group" position="0 0.5 0" visible="false">
            <a-video src="#geo-video" width="3.2" height="1.8" position="0 0.5 0"></a-video>
            <a-plane position="0 0.5 -0.02" width="3.3" height="1.9" color="#0f172a"></a-plane>
        </a-entity>

    </a-scene>

    <!-- البرمجية التفاعلية ولوحة التتبع -->
    <script>
        let currentMode = '3d';
        let isRotating = false;
        let opacityState = 0.75;
        let quizTriggered = false;

        // السجل الخفي لتتبع أداء الطالب (Analytics Engine)
        const userAnalytics = {
            startTime: new Date().valueOf(),
            modeSwitches: 0,
            opacityToggles: 0,
            quizCorrect: false
        };

        // التبديل بين النمطين
        function switchMode(mode) {
            currentMode = mode;
            userAnalytics.modeSwitches++;
            
            const group3D = document.getElementById('mode-3d-group');
            const groupVideo = document.getElementById('mode-video-group');
            const videoElement = document.getElementById('geo-video');
            const btn3D = document.getElementById('btn-3d');
            const btnVideo = document.getElementById('btn-video');
            const simControls = document.getElementById('sim-controls');

            if (mode === '3d') {
                group3D.setAttribute('visible', 'true');
                groupVideo.setAttribute('visible', 'false');
                videoElement.pause();
                
                btn3D.classList.add('active');
                btnVideo.classList.remove('active');
                simControls.style.display = 'block';
            } else {
                group3D.setAttribute('visible', 'false');
                groupVideo.setAttribute('visible', 'true');
                videoElement.play();

                btnVideo.classList.add('active');
                btn3D.classList.remove('active');
                simControls.style.display = 'none';

                // إظهار سؤال مفاجئ عند الدقيقة 0:05 من الفيديو
                if(!quizTriggered) {
                    setTimeout(() => {
                        videoElement.pause();
                        document.getElementById('quiz-overlay').style.display = 'block';
                        quizTriggered = true;
                    }, 5000);
                }
            }
        }

        // التحديث الديناميكي لمعادلة المستوى والمجسم ثلاثي الأبعاد
        function updatePlaneEquation() {
            const a = parseFloat(document.getElementById('slider-a').value);
            const b = parseFloat(document.getElementById('slider-b').value);
            const c = parseFloat(document.getElementById('slider-c').value);

            document.getElementById('val-a').innerText = a;
            document.getElementById('val-b').innerText = b;
            document.getElementById('val-c').innerText = c;

            const plane = document.getElementById('geo-plane');
            const normal = document.getElementById('normal-vector');

            // تحريك وزاوية المستوى والمحتوى بناء على قيم المعاملات
            const rotX = a * 30;
            const rotY = b * 45;
            const rotZ = c * 20;

            plane.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`);
            normal.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`);
        }

        // تدوير المجسم
        function rotateModel() {
            const group3D = document.getElementById('mode-3d-group');
            isRotating = !isRotating;
            if(isRotating) {
                group3D.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear');
            } else {
                group3D.removeAttribute('animation');
            }
        }

        // الشفافية
        function togglePlaneOpacity() {
            userAnalytics.opacityToggles++;
            const plane = document.getElementById('geo-plane');
            opacityState = opacityState === 0.75 ? 0.35 : 0.75;
            plane.setAttribute('material', 'opacity', opacityState);
        }

        // إجابة الاختبار المرحلي
        function answerQuiz(isCorrect) {
            userAnalytics.quizCorrect = isCorrect;
            document.getElementById('quiz-overlay').style.display = 'none';
            const videoElement = document.getElementById('geo-video');
            videoElement.play();
            
            if(isCorrect) {
                alert('إجابة صحيحة وممتازة! أحسنت 🌟');
            } else {
                alert('إجابة خاطئة. المتجه العمودي يتكون من معامل X و Y و Z بالترتيب.');
            }
        }
    </script>
</body>
</html>
