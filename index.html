<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيئة الهندسة الفراغية المعززة AR-Geo3D Pro</title>
    <!-- استدعاء مكتبات A-Frame الحديثة والمستقرة -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        :root {
            --panel-bg: rgba(15, 23, 42, 0.95);
            --accent-color: #0284c7;
            --text-light: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #020617;
            color: var(--text-light);
        }

        /* شريط العنوان العلوي الاحترافي */
        #ui-header {
            position: absolute;
            top: 10px;
            right: 10px;
            left: 10px;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .title-box h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #38bdf8;
        }
        .title-box p {
            margin: 2px 0 0 0;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .mode-switch {
            display: flex;
            gap: 6px;
            background: #1e293b;
            padding: 4px;
            border-radius: 10px;
        }

        .btn-mode {
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.82rem;
            color: #94a3b8;
            background: transparent;
            transition: all 0.3s ease;
        }

        .btn-mode.active {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
        }

        /* لوحة التحكم الجانبية واختيار الموضوعات */
        #selector-panel {
            position: absolute;
            top: 80px;
            right: 10px;
            z-index: 999;
            background: var(--panel-bg);
            padding: 14px;
            border-radius: 14px;
            width: 270px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        .shape-select {
            width: 100%;
            padding: 9px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 0.82rem;
            outline: none;
            cursor: pointer;
        }

        .btn-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-action {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-action:hover { background: var(--accent-color); }

        /* صندوق وصف المفهوم العلمي الظاهر على الشاشة */
        #concept-box {
            position: absolute;
            bottom: 20px;
            right: 10px;
            z-index: 999;
            background: var(--panel-bg);
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 320px;
            border-right: 4px solid #38bdf8;
            font-size: 0.85rem;
            line-height: 1.5;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        #concept-box h4 { margin: 0 0 5px 0; color: #38bdf8; font-size: 0.95rem; }
        #concept-box p { margin: 0; color: #cbd5e1; font-size: 0.8rem; }

        /* شريط التحكم بالفيديو الفعلي */
        #video-controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 25px;
            display: none;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .btn-video-ctrl {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 15px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-header">
        <div class="title-box">
            <h1>📐 الهندسة الفراغية المعززة (AR-Geo3D Pro)</h1>
            <p>الصف الثالث الثانوي - كتاب وزارة التربية والتعليم</p>
        </div>
        <div class="mode-switch">
            <button class="btn-mode active" id="btn-3d" onclick="switchMode('3d')">النمط 1: مجسمات 3D والمفاهيم</button>
            <button class="btn-mode" id="btn-video" onclick="switchMode('video')">النمط 2: الفيديوهات الفعلية</button>
        </div>
    </div>

    <!-- لوحة اختيار الموضوعات -->
    <div id="selector-panel">
        <label style="font-size:0.82rem; color:#38bdf8; font-weight:bold; display:block; margin-bottom:6px;">📘 اختر موضوع وشكل الدرس:</label>
        <select id="shape-dropdown" class="shape-select" onchange="onTopicChange(this.value)">
            <option value="plane">1. المستوى ومتجه العمود n (ax+by+cz=d)</option>
            <option value="sphere">2. معادلة الكرة في الفراغ ومركزها</option>
            <option value="intersect">3. تقاطع مستويين في خط مستقيم</option>
            <option value="skew">4. المستقيمات المتخالفة في الفراغ</option>
            <option value="cuboid">5. متوازي المستطيلات الإحداثي</option>
            <option value="vector">6. المتجهات وزوايا الاتجاه 3D</option>
        </select>

        <div class="btn-actions" id="tools-3d">
            <button class="btn-action" onclick="rotateModel()">🔄 تدوير المشهد</button>
            <button class="btn-action" onclick="resetView()">🎯 ضبط الوضع</button>
        </div>
    </div>

    <!-- صندوق عرض المفهوم العلمي المرتبط بالمشهد -->
    <div id="concept-box">
        <h4 id="c-title">معادلة المستوى في الفراغ</h4>
        <p id="c-desc">المستوى يُعين بمعرفة نقطة تنتمي إليه ومتجه عمودي عليه (\vec{n}). المعادلة العامة: ax + by + cz + d = 0.</p>
    </div>

    <!-- لوحة التحكم بالفيديو الفعلي -->
    <div id="video-controls-panel">
        <button class="btn-video-ctrl" onclick="playVideo()">▶️ تشغيل الفيديو</button>
        <button class="btn-video-ctrl" onclick="pauseVideo()">⏸️ إيقاف مؤقت</button>
        <button class="btn-video-ctrl" onclick="restartVideo()">🔄 إعادة الشرح</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets>
            <!-- مصادر فيديوهات فعلية ومستقرة للمناهج التعليمية -->
            <video id="v-plane" playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
            <video id="v-sphere" playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"></video>
            <video id="v-intersect" playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"></video>
            <video id="v-skew" playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"></video>
            <video id="v-cuboid" playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"></video>
            <video id="v-vector" playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"></video>
        </a-assets>

        <!-- إضاءة متزنة للمشهد -->
        <a-entity light="type: ambient; color: #FFF; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.9" position="-1 2 1"></a-entity>

        <a-entity camera position="0 2 5.0" look-controls orbit-controls="target: 0 0.5 0; minDistance: 1.5; maxDistance: 9;"></a-entity>

        <!-- [النمط 1: المجسمات ثلاثية الأبعاد والمفاهيم المرتبطة بها بدقة تامة] -->
        <a-entity id="mode-3d-group" position="0 0 0">
            
            <!-- المحاور الإحداثية الحادة والنظيفة بدقة (بدون أي كرات نهائية) -->
            <a-entity id="axis-system">
                <a-cylinder position="1.2 0 0" rotation="0 0 -90" radius="0.015" height="2.4" color="#EF4444"></a-cylinder>
                <a-text value="X" position="2.5 0 0" color="#EF4444" scale="1.2 1.2 1.2" align="center"></a-text>

                <a-cylinder position="0 1.2 0" radius="0.015" height="2.4" color="#22C55E"></a-cylinder>
                <a-text value="Y" position="0 2.5 0" color="#22C55E" scale="1.2 1.2 1.2" align="center"></a-text>

                <a-cylinder position="0 0 1.2" rotation="90 0 0" radius="0.015" height="2.4" color="#3B82F6"></a-cylinder>
                <a-text value="Z" position="0 0 2.5" color="#3B82F6" scale="1.2 1.2 1.2" align="center"></a-text>
            </a-entity>

            <!-- 1. المستوى ومتجه العمود n -->
            <a-entity id="shape-plane" visible="true">
                <a-plane position="0 0.5 0" rotation="-35 25 0" width="2.8" height="2.8" color="#0284C7" material="side: double; transparent: true; opacity: 0.75;"></a-plane>
                <a-entity position="0 0.5 0" rotation="-35 25 0">
                    <a-cylinder position="0 0 0.8" rotation="90 0 0" radius="0.025" height="1.6" color="#F59E0B"></a-cylinder>
                    <a-text value="n (a,b,c)" position="0.3 0 1.7" color="#F59E0B" scale="1.1 1.1 1.1"></a-text>
                </a-entity>
            </a-entity>

            <!-- 2. معادلة الكرة ومركزها -->
            <a-entity id="shape-sphere" visible="false">
                <a-sphere position="0 0.8 0" radius="1.2" color="#EC4899" material="wireframe: true; wireframeLinewidth: 2;"></a-sphere>
                <a-text value="M(l, m, n) & r" position="0 2.2 0" color="#EC4899" scale="1.2 1.2 1.2" align="center"></a-text>
            </a-entity>

            <!-- 3. تقاطع مستويين -->
            <a-entity id="shape-intersect" visible="false">
                <a-plane position="0 0.6 0" rotation="-20 40 0" width="2.6" height="2.0" color="#0284C7" material="side: double; transparent: true; opacity: 0.7;"></a-plane>
                <a-plane position="0 0.6 0" rotation="50 -20 0" width="2.6" height="2.0" color="#10B981" material="side: double; transparent: true; opacity: 0.7;"></a-plane>
                <a-cylinder position="0 0.6 0" rotation="0 40 90" radius="0.035" height="2.6" color="#F59E0B"></a-cylinder>
                <a-text value="خط تقاطع المستويين" position="0 1.8 0" color="#F59E0B" scale="1.1 1.1 1.1" align="center"></a-text>
            </a-entity>

            <!-- 4. المستقيمات المتخالفة -->
            <a-entity id="shape-skew" visible="false">
                <a-plane position="0 1.3 0" rotation="-90 0 0" width="2.4" height="1.8" color="#64748B" material="side: double; transparent: true; opacity: 0.3;"></a-plane>
                <a-plane position="0 -0.1 0" rotation="-90 0 0" width="2.4" height="1.8" color="#64748B" material="side: double; transparent: true; opacity: 0.3;"></a-plane>
                <a-cylinder position="0 1.3 0" rotation="0 30 90" radius="0.03" height="2.2" color="#EF4444"></a-cylinder>
                <a-cylinder position="0 -0.1 0" rotation="0 -60 90" radius="0.03" height="2.2" color="#3B82F6"></a-cylinder>
                <a-text value="مستقيمان متخالفان (لا يجمعهما مستوى)" position="0 2.0 0" color="#EF4444" scale="1 1 1" align="center"></a-text>
            </a-entity>

            <!-- 5. متوازي المستطيلات الإحداثي -->
            <a-entity id="shape-cuboid" visible="false">
                <a-box position="0.8 0.6 0.8" width="1.6" height="1.2" depth="1.6" color="#8B5CF6" material="wireframe: true; wireframeLinewidth: 2.5;"></a-box>
                <a-text value="النقطة P(x, y, z)" position="1.6 1.4 1.6" color="#8B5CF6" scale="1.1 1.1 1.1"></a-text>
            </a-entity>

            <!-- 6. المتجهات وزوايا الاتجاه -->
            <a-entity id="shape-vector" visible="false">
                <a-cylinder position="0.6 0.7 0.6" rotation="-35 45 0" radius="0.03" height="1.8" color="#F59E0B"></a-cylinder>
                <a-text value="متجه الموضع r = (s, c, t)" position="1.2 1.5 1.1" color="#F59E0B" scale="1.1 1.1 1.1"></a-text>
            </a-entity>

        </a-entity>

        <!-- [النمط 2: مشغل الفيديو الفعلي والمخصص] -->
        <a-entity id="mode-video-group" position="0 0.6 0" visible="false">
            <a-video id="video-screen" src="#v-plane" width="3.8" height="2.1" position="0 0.5 0"></a-video>
            <a-plane position="0 0.5 -0.04" width="3.95" height="2.25" color="#0F172A"></a-plane>
        </a-entity>

    </a-scene>

    <script>
        let currentMode = '3d';
        let currentTopic = 'plane';
        let isRotating = false;

        // خريطة المفاهيم العلمية المرتبطة بكل درس
        const conceptData = {
            'plane': {
                title: 'معادلة المستوى في الفراغ',
                desc: 'المستوى يُعين بمعرفة نقطة تنتمي إليه ومتجه عمودي عليه (n). وتُكتب المعادلة القيصرية والمتجهة بالشكل: ax + by + cz = d.'
            },
            'sphere': {
                title: 'معادلة الكرة في الفراغ',
                desc: 'الكرة هي مجموعة نقاط تبعد بعداً ثابتاً (نصف القطر r) عن نقطة ثابتة (المركز M). المعادلة: (س-ل)^2 + (ص-م)^2 + (ع-ن)^2 = ر^2.'
            },
            'intersect': {
                title: 'تقاطع مستويين في الفراغ',
                desc: 'يتقاطع المستويان في الفراغ دائماً على شكل "خط مستقيم" إذا لم يكونا متوازيين أو منطبقين، وحل معادلتهما يعطي معادلة الخط المستقيم.'
            },
            'skew': {
                title: 'المستقيمات المتخالفة',
                desc: 'المستقيمان المتخالفان هما مستقيمان لا يجمعهما مستوى واحد، وغير متقاطعين وغير متوازيين (لا يتقاطعان مهما طُرفا).'
            },
            'cuboid': {
                title: 'متوازي المستطيلات والإحداثيات',
                desc: 'يُستخدم متوازي المستطيلات لتمثيل إحداثيات أي نقطة في الفراغ الثلاثي (س، ص، ع) وتحديد المساقط على المستويات الإحداثية الثلاثة.'
            },
            'vector': {
                title: 'المتجهات وزوايا الاتجاه 3D',
                desc: 'المتجه في الفراغ يُحدد بمركباته الثلاثة واتجاهه يصنع زوايا (θx, θy, θz) مع المحاور الإحداثية الموجبة، حيث جتا^2 + جتا^2 + جتا^2 = 1.'
            }
        };

        const vMap = {
            'plane': '#v-plane',
            'sphere': '#v-sphere',
            'intersect': '#v-intersect',
            'skew': '#v-skew',
            'cuboid': '#v-cuboid',
            'vector': '#v-vector'
        };

        function switchMode(mode) {
            currentMode = mode;
            const group3D = document.getElementById('mode-3d-group');
            const groupVideo = document.getElementById('mode-video-group');
            const btn3D = document.getElementById('btn-3d');
            const btnVideo = document.getElementById('btn-video');
            const vControls = document.getElementById('video-controls-panel');
            const conceptBox = document.getElementById('concept-box');
            const tools3D = document.getElementById('tools-3d');

            if (mode === '3d') {
                group3D.setAttribute('visible', 'true');
                groupVideo.setAttribute('visible', 'false');
                stopAllVideos();
                
                btn3D.classList.add('active');
                btnVideo.classList.remove('active');
                vControls.style.display = 'none';
                conceptBox.style.display = 'block';
                tools3D.style.display = 'grid';
            } else {
                group3D.setAttribute('visible', 'false');
                groupVideo.setAttribute('visible', 'true');
                
                btnVideo.classList.add('active');
                btn3D.classList.remove('active');
                vControls.style.display = 'flex';
                conceptBox.style.display = 'none';
                tools3D.style.display = 'none';
                
                playTopicVideo();
            }
        }

        function onTopicChange(val) {
            currentTopic = val;
            
            // 1. إظهار المجسم المرتبط وإخفاء الباقي
            const shapes = ['plane', 'sphere', 'intersect', 'skew', 'cuboid', 'vector'];
            shapes.forEach(s => {
                const elem = document.getElementById(`shape-${s}`);
                if (elem) elem.setAttribute('visible', s === val);
            });

            // 2. تحديث صندوق المفهوم العلمي النصي تلقائياً
            const cData = conceptData[val];
            document.getElementById('c-title').innerText = cData.title;
            document.getElementById('c-desc').innerText = cData.desc;

            // 3. إذا كان في نمط الفيديو، قم بتغيير الفيديو الفعلي للموضوع المختار
            if (currentMode === 'video') {
                playTopicVideo();
            }
        }

        function playTopicVideo() {
            stopAllVideos();
            const vId = vMap[currentTopic];
            const videoScreen = document.getElementById('video-screen');
            videoScreen.setAttribute('src', vId);
            const vEl = document.querySelector(vId);
            if(vEl) {
                vEl.currentTime = 0;
                vEl.play();
            }
        }

        function stopAllVideos() {
            Object.values(vMap).forEach(id => {
                const el = document.querySelector(id);
                if(el) el.pause();
            });
        }

        function playVideo() {
            const el = document.querySelector(vMap[currentTopic]);
            if(el) el.play();
        }

        function pauseVideo() {
            stopAllVideos();
        }

        function restartVideo() {
            playTopicVideo();
        }

        function rotateModel() {
            const group3D = document.getElementById('mode-3d-group');
            isRotating = !isRotating;
            if(isRotating) {
                group3D.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
            } else {
                group3D.removeAttribute('animation');
            }
        }

        function resetView() {
            const group3D = document.getElementById('mode-3d-group');
            group3D.removeAttribute('animation');
            group3D.setAttribute('rotation', '0 0 0');
            isRotating = false;
        }
    </script>
</body>
</html>
