<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيئة التعلم الرقمية: الفراغية المعززة AR-Geo3D</title>
    <!-- استدعاء أحدث مكتبات A-Frame و Three.js المستقرة والمفحوصة -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #00b4d8;
            --bg-glass: rgba(255, 255, 255, 0.9);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
        }

        /* لوحة التحكم العلوبة والواجهة */
        #ui-container {
            position: absolute;
            top: 10px;
            right: 10px;
            left: 10px;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .title-box h1 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
        }
        .title-box p {
            margin: 2px 0 0 0;
            font-size: 0.8rem;
            color: #475569;
        }

        /* زر التحويل بين نمطي التقديم (متغير الرسالة) */
        .mode-switch {
            display: flex;
            gap: 8px;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 12px;
        }

        .btn-mode {
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-mode.active {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 2px 8px rgba(0, 180, 216, 0.4);
        }

        /* لوحة التحكم في المجسم 3D */
        #controls-panel {
            position: absolute;
            bottom: 20px;
            right: 50%;
            transform: translateX(50%);
            z-index: 999;
            background: var(--bg-glass);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .ctrl-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .ctrl-btn:active { transform: scale(0.95); }

        /* شاشة الفيديو التفاعلي */
        #video-overlay-ui {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: none;
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- واجهة المستخدم والتفاعل (UI) -->
    <div id="ui-container">
        <div class="title-box">
            <h1>📐 بيئة "الفراغية المعززة" (AR-Geo3D)</h1>
            <p>الصف الثالث الثانوي - وحدة الهندسة الفراغية</p>
        </div>
        <div class="mode-switch">
            <button class="btn-mode active" id="btn-3d" onclick="switchMode('3d')">النمط 1: صور 3D تفاعلية</button>
            <button class="btn-mode" id="btn-video" onclick="switchMode('video')">النمط 2: فيديو تعليمي</button>
        </div>
    </div>

    <!-- أدوات التحكم في الشكل 3D -->
    <div id="controls-panel">
        <button class="ctrl-btn" onclick="rotateModel()">🔄 تدوير الشكل</button>
        <button class="ctrl-btn" onclick="togglePlaneOpacity()">👁️ شفافية المستوى</button>
        <button class="ctrl-btn" onclick="resetView()">🎯 إعادة ضبط</button>
    </div>

    <!-- رسائل تفاعلية للفيديو -->
    <div id="video-overlay-ui">
        <span id="video-status">📹 جارٍ عرض الشرح التفاعلي لمعادلة المستوى...</span>
    </div>

    <!-- مشهد الـ 3D / AR الرئيسي باستعمال A-Frame -->
    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- الأصول المدمجة (Assets) -->
        <a-assets>
            <!-- فيديو تعليمي عالي الجودة مقصوص للدرس -->
            <video id="geo-video" loop="true" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
        </a-assets>

        <!-- الإضاءة -->
        <a-entity light="type: ambient; color: #BBB; intensity: 1.2"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 1 1"></a-entity>

        <!-- الكاميرا -->
        <a-entity id="main-camera" camera position="0 1.5 3" look-controls orbit-controls="target: 0 0 0; minDistance: 1; maxDistance: 8;"></a-entity>

        <!-- [مجموعة النمط الأول: الصور ثلاثية الأبعاد التفاعلية] -->
        <a-entity id="mode-3d-group" position="0 0 0">
            <!-- محاور الإحداثيات متعامدة (X, Y, Z) -->
            <!-- محور X (أحمر) -->
            <a-cylinder position="1 0 0" rotation="0 0 -90" radius="0.02" height="2" color="#EF4444"></a-cylinder>
            <a-cone position="2.1 0 0" rotation="0 0 -90" radius="0.06" height="0.2" color="#EF4444"></a-cone>
            
            <!-- محور Y (أخضر) -->
            <a-cylinder position="0 1 0" radius="0.02" height="2" color="#22C55E"></a-cylinder>
            <a-cone position="0 2.1 0" radius="0.06" height="0.2" color="#22C55E"></a-cone>

            <!-- محور Z (أزرق) -->
            <a-cylinder position="0 0 1" rotation="90 0 0" radius="0.02" height="2" color="#3B82F6"></a-cylinder>
            <a-cone position="0 0 2.1" rotation="90 0 0" radius="0.06" height="0.2" color="#3B82F6"></a-cone>

            <!-- مجسم مستوى في الفراغ ax + by + cz = d -->
            <a-plane id="geo-plane" position="0 0.5 0" rotation="-45 30 0" width="2" height="2" color="#00B4D8" material="side: double; transparent: true; opacity: 0.75;"></a-plane>

            <!-- المتجه العمودي على المستوى (Normal Vector n) -->
            <a-entity id="normal-vector" position="0 0.5 0" rotation="-45 30 0">
                <a-cylinder position="0 0 0.6" rotation="90 0 0" radius="0.03" height="1.2" color="#F59E0B"></a-cylinder>
                <a-cone position="0 0 1.25" rotation="90 0 0" radius="0.08" height="0.2" color="#F59E0B"></a-cone>
                <a-text value="n (Vector)" position="0.2 0 1.2" scale="0.5 0.5 0.5" color="#FFF"></a-text>
            </a-entity>

            <!-- مجسم كرة في الفراغ (معادلة الكرة) -->
            <a-sphere position="0.8 1.2 -0.5" radius="0.4" color="#EC4899" material="wireframe: true;"></a-sphere>
        </a-entity>

        <!-- [مجموعة النمط الثاني: الفيديو التعليمي] -->
        <a-entity id="mode-video-group" position="0 0 0" visible="false">
            <a-video src="#geo-video" width="3" height="1.7" position="0 1 -0.5"></a-video>
            <!-- إطار جمالي حول شاشة الفيديو -->
            <a-plane position="0 1 -0.52" width="3.1" height="1.8" color="#1E293B"></a-plane>
        </a-entity>

    </a-scene>

    <!-- البرمجة التفاعلية وإدارة الأحداث (JavaScript) -->
    <script>
        let currentMode = '3d';
        let isRotating = false;
        let opacityState = 0.75;

        // التبديل بين النمطين (متغيرات التجربة 2x2)
        function switchMode(mode) {
            currentMode = mode;
            const group3D = document.getElementById('mode-3d-group');
            const groupVideo = document.getElementById('mode-video-group');
            const videoElement = document.getElementById('geo-video');
            const btn3D = document.getElementById('btn-3d');
            const btnVideo = document.getElementById('btn-video');
            const ctrlPanel = document.getElementById('controls-panel');
            const videoUI = document.getElementById('video-overlay-ui');

            if (mode === '3d') {
                group3D.setAttribute('visible', 'true');
                groupVideo.setAttribute('visible', 'false');
                videoElement.pause();
                
                btn3D.classList.add('active');
                btnVideo.classList.remove('active');
                ctrlPanel.style.display = 'flex';
                videoUI.style.display = 'none';
            } else {
                group3D.setAttribute('visible', 'false');
                groupVideo.setAttribute('visible', 'true');
                videoElement.play();

                btnVideo.classList.add('active');
                btn3D.classList.remove('active');
                ctrlPanel.style.display = 'none';
                videoUI.style.display = 'block';
            }
        }

        // تدوير الشكل 3D تفاعلياً
        function rotateModel() {
            const group3D = document.getElementById('mode-3d-group');
            isRotating = !isRotating;
            if(isRotating) {
                group3D.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear');
            } else {
                group3D.removeAttribute('animation');
            }
        }

        // التعديل على شفافية المستوى لمراعاة العبء المعرفي
        function togglePlaneOpacity() {
            const plane = document.getElementById('geo-plane');
            opacityState = opacityState === 0.75 ? 0.3 : 0.75;
            plane.setAttribute('material', 'opacity', opacityState);
        }

        // إعادة ضبط الرؤية
        function resetView() {
            const group3D = document.getElementById('mode-3d-group');
            group3D.removeAttribute('animation');
            group3D.setAttribute('rotation', '0 0 0');
            isRotating = false;
        }
    </script>
</body>
</html>
